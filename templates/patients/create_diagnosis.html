{% extends "base.html" %}
{% block title %}Create Diagnosis{% endblock %}
{% block content %}
<div class="card">
  <h2>Create Encrypted Diagnosis</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save Diagnosis</button>
  </form>
  <p class="empty">Patient IDs: {% for p in patients %}{{ p.id }}={{ p.user.email }} {% endfor %}</p>
</div>
{% endblock %}
