{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="card">
  <h2>Profile Settings</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
  </form>
  <p><a href="{% url 'accounts:password_change' %}">Change password</a></p>
</div>
{% endblock %}
