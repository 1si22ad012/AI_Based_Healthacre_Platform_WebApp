{% extends "base.html" %}
{% block title %}User Management{% endblock %}
{% block content %}
<div class="card">
  <h2>User Management</h2>
  <form method="post" class="grid grid-2">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Create User</button>
  </form>
</div>
<div class="card">
  <table>
    <tr><th>Email</th><th>Role</th><th>Active</th><th>Action</th></tr>
    {% for u in users %}
    <tr>
      <td>{{ u.email }}</td>
      <td>{{ u.role }}</td>
      <td>{{ u.is_active }}</td>
      <td>
        <form method="post" action="{% url 'accounts:toggle_user' u.id %}" style="display:inline;">
          {% csrf_token %}
          <button class="btn btn-secondary" type="submit">Toggle</button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4" class="empty">No users</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
