{% extends "base.html" %}
{% block title %}Anomaly Alerts{% endblock %}
{% block content %}
<h2>Anomaly Alerts</h2>
<div class="card">
  <table>
    <tr><th>Time</th><th>Detector</th><th>Score</th><th>Status</th><th>Actions</th></tr>
    {% for a in alerts %}
    <tr>
      <td>{{ a.created_at }}</td>
      <td>{{ a.detector }}</td>
      <td>{{ a.score }}</td>
      <td>{{ a.status }}</td>
      <td>
        <form method="post" style="display:inline;">
          {% csrf_token %}
          <input type="hidden" name="alert_id" value="{{ a.id }}">
          <button class="btn btn-secondary" name="action" value="investigate" type="submit">Investigate</button>
          <button class="btn" name="action" value="resolve" type="submit">Resolve</button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="5" class="empty">No alerts</td></tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
